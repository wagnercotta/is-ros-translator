// Historical RPC shape from viniciusbaltoe/is-ros-translator (2021-2022).
// This descriptor is used by an OPTIONAL partial migration adapter.
syntax = "proto3";
package is.ros;
import "google/protobuf/any.proto";
message ROSTranslateRequest {
  string topic = 1;
  google.protobuf.Any any = 2;
  string function = 3;
}
message ROSTranslateReply {
  string data = 1;
  google.protobuf.Any any = 2;
}
