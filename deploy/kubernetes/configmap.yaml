apiVersion: v1
kind: ConfigMap
metadata:
  name: is-ros-translator-config
  namespace: is-ros-translator
data:
  gateway.yaml: |
    http:
      enabled: true
      host: 0.0.0.0
      port: 8080
    iswire:
      enabled: true
      url_env: ISWIRE_BROKER_URI
      request_topic: ROSTranslator.v2.Request
      robot_task_topic: ROSTranslator.v2.RobotTask
      event_prefix: ROSTranslator.v2.Event
      pose_event_prefix: ROSTranslator.v2.Pose
    security:
      require_api_key: true
      api_key_env: GATEWAY_API_KEY
      allow_live_schema_fallback: false
      max_request_bytes: 1048576
      max_response_bytes: 4194304
    schema_ttl_seconds: 300
    subscription_lease_seconds: 120
    max_subscriptions: 100
    default_timeout_seconds: 30
    robots:
      jackal_ros1_a:
        ros_version: 1
        host: rosbridge.ros1-a.svc
        port: 9090
        navigation:
          action: /move_base
          action_type: move_base_msgs/MoveBaseAction
          frame_id: map
        map_service: /dynamic_map
        odom_topic: /odom
        allowed:
          publish: [/chatter]
          subscribe: [/odom, /chatter]
          services: [/dynamic_map]
          actions: [/move_base]
        capabilities:
          announce:
            operation: ros.publish
            endpoint: /chatter
            ros_type: std_msgs/String
            default_payload: {data: "Hello from ROS 1 A"}
            description: Publishes an announcement to the robot
          map_snapshot:
            operation: ros.service
            endpoint: /dynamic_map
            ros_type: nav_msgs/GetMap
            description: Retrieves the map using a ROS 1 service
      jackal_ros1_b:
        ros_version: 1
        host: rosbridge.ros1-b.svc
        port: 9090
        navigation:
          action: /move_base
          action_type: move_base_msgs/MoveBaseAction
          frame_id: map
        map_service: /dynamic_map
        odom_topic: /odom
        allowed:
          publish: [/chatter]
          subscribe: [/odom, /chatter]
          services: [/dynamic_map]
          actions: [/move_base]
        capabilities:
          announce:
            operation: ros.publish
            endpoint: /chatter
            ros_type: std_msgs/String
            default_payload: {data: "Hello from ROS 1 B"}
      turtlebot_ros2:
        ros_version: 2
        host: rosbridge.ros2-a.svc
        port: 9090
        navigation:
          action: /navigate_to_pose
          action_type: nav2_msgs/action/NavigateToPose
          frame_id: map
        map_service: /map_server/map
        odom_topic: /odom
        allowed:
          publish: [/chatter, /goal_pose]
          subscribe: [/odom, /chatter, /tf, /tf_static]
          services: [/map_server/map]
          actions: [/navigate_to_pose]
        capabilities:
          announce:
            operation: ros.publish
            endpoint: /chatter
            ros_type: std_msgs/msg/String
            default_payload: {data: "Hello from ROS 2 A"}
          map_snapshot:
            operation: ros.service
            endpoint: /map_server/map
            ros_type: nav_msgs/srv/GetMap
          monitor_odometry:
            operation: ros.subscribe
            endpoint: /odom
            ros_type: nav_msgs/msg/Odometry
            description: Starts a leased odometry event subscription
          stop_monitoring_odometry:
            operation: ros.unsubscribe
            endpoint: /odom
            description: Removes a subscriber from odometry events
          navigate_action:
            operation: ros.action
            endpoint: /navigate_to_pose
            ros_type: nav2_msgs/action/NavigateToPose
            description: Runs a ROS 2 navigation action with an explicit goal
      turtlebot_ros2_b:
        ros_version: 2
        host: rosbridge.ros2-b.svc
        port: 9090
        navigation:
          action: /navigate_to_pose
          action_type: nav2_msgs/action/NavigateToPose
          frame_id: map
        map_service: /map_server/map
        odom_topic: /odom
        allowed:
          publish: [/chatter, /goal_pose]
          subscribe: [/odom, /chatter, /tf, /tf_static]
          services: [/map_server/map]
          actions: [/navigate_to_pose]
        capabilities:
          announce:
            operation: ros.publish
            endpoint: /chatter
            ros_type: std_msgs/msg/String
            default_payload: {data: "Hello from ROS 2 B"}
          navigate_action:
            operation: ros.action
            endpoint: /navigate_to_pose
            ros_type: nav2_msgs/action/NavigateToPose
